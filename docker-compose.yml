services:
  # HARDENING_PLAN.md finding L12: credentials come from the environment
  # (this project's own root .env, gitignored like backend/.env — see
  # .env.example here for the variables and their dev-only defaults) instead
  # of being hardcoded in this file, and the port is bound to localhost only
  # instead of every interface on the host.
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clonevoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clonevoice_dev}
      POSTGRES_DB: ${POSTGRES_DB:-clonevoice}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clonevoice}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HARDENING_PLAN.md finding M3: shared rate-limit storage, so limits hold
  # across restarts and (later) multiple workers/replicas. Not published to
  # the host — only the compose network can reach it.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HARDENING_PLAN.md finding P2-M2: one-shot schema migration. Runs
  # `alembic upgrade head` against the same image and database as `backend`,
  # then exits; `backend` waits for it to complete successfully, so a fresh
  # `docker compose up` never serves requests against an empty schema.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clonevoice}:${POSTGRES_PASSWORD:-clonevoice_dev}@db:5432/${POSTGRES_DB:-clonevoice}
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    # Overrides the image HEALTHCHECK, which probes the API port this
    # one-shot process never opens.
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # HARDENING_PLAN.md finding H7: this service (plus backend/Dockerfile) was
  # previously missing entirely — `docker-compose up --build` (the README's
  # only documented start command) could bring up `db` but never the API.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Secrets (JWT_SECRET_KEY, GOOGLE_CLIENT_SECRET, ...) come from your own
    # backend/.env (gitignored, never baked into the image — see
    # backend/.env.example and README.md "Environment Setup").
    env_file:
      - backend/.env
    environment:
      # Overrides whatever DATABASE_URL is in backend/.env: inside the
      # compose network the DB is reachable at the `db` service name, not
      # `localhost` (which .env.example defaults to for bare-metal/local
      # use), and it's built from the same POSTGRES_* variables as the `db`
      # service above (finding L12) so the two can never drift apart.
      DATABASE_URL: postgresql://${POSTGRES_USER:-clonevoice}:${POSTGRES_PASSWORD:-clonevoice_dev}@db:5432/${POSTGRES_DB:-clonevoice}
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
    # HARDENING_PLAN.md finding P2-L6: bound to localhost by default, like the
    # db service (L12), so the API isn't reachable from other machines unless a
    # reverse proxy on this host fronts it. Set BACKEND_BIND_ADDRESS=0.0.0.0 in
    # the root .env to publish it on every interface deliberately.
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    # HARDENING_PLAN.md finding P2-L4: Docker's default 10 s stop grace would
    # SIGKILL the process before shutdown finishes. 70 s = uvicorn's 30 s
    # --timeout-graceful-shutdown (Dockerfile CMD) + the 30 s inference drain
    # (INFERENCE_SHUTDOWN_DRAIN_TIMEOUT_SECONDS) + a 10 s margin. Raise it if
    # you raise either of those.
    stop_grace_period: 70s
    volumes:
      # Model checkpoints, uploads, and outputs are deliberately not baked
      # into the image (see backend/Dockerfile, .dockerignore) — these
      # volumes are what make them persist across container recreation.
      # WEIGHTS_DIR, UPLOAD_DIR and OUTPUT_DIR are all anchored to BASE_DIR
      # (/app/backend), independent of the container's working directory.
      - backend_weights:/app/backend/weights
      - backend_uploads:/app/backend/uploads
      - backend_outputs:/app/backend/outputs
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Exactly one container, one uvicorn worker (set explicitly in
    # backend/Dockerfile's CMD) — the inference semaphore (H6) is process-local
    # state, so do not scale this via `--workers` or `deploy.replicas` without
    # addressing that first (rate limits are shared via redis, see M3).

volumes:
  postgres_data:
  backend_weights:
  backend_uploads:
  backend_outputs:
