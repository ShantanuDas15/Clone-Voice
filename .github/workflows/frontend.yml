name: frontend

# No `paths:` filter, on purpose. `check`, `perf` and `visual` are required status checks on `main`
# (branch protection), so a pull request that only touches the backend or the docs must still get
# them reported; with a path filter they would never run and the PR could not be merged.
# `push` only for main: a branch with an open PR would otherwise run every check twice (push and
# pull_request), and one failing duplicate of a required check blocks the merge.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 20/22: on Node 20 and 22 a multipart upload (FormData with a file) through
          # jsdom's XMLHttpRequest and MSW never completes, which hung 11 unit tests and kept
          # this job red for every run until FE-UX42. Node 24 is what the suite is developed on
          # (frontend/.nvmrc); tests/ci-workflows.test.ts keeps it from going back.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Next 14.x has advisories fixed only in 15+ (see FRONTEND_IMPLEMENTATION_PLAN.md
      # task log, FE-P0). Non-blocking until the owner approves a Next upgrade.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # Lighthouse budget gate (FRONTEND_IMPLEMENTATION_PLAN.md, FE-P7f). Public routes only, so no
  # backend is needed. Lighthouse 13 requires Node 22+ (the `check` job stays on Node 20).
  perf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start the production server
        run: |
          nohup npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login > /dev/null && exit 0
            sleep 1
          done
          cat next.log
          exit 1
      # LCP on a shared runner swings by about half a second on identical code (the same page
      # measured 1.84 s and 2.56 s in two runs of the same commit), and a spike hits one route at a
      # time. perf/run.mjs therefore measures a route that misses again (PERF_ATTEMPTS) and fails
      # it only if every attempt is over; a real regression (the /terms one measured 2.62-2.67 s
      # every time) misses on all of them. The 2.5 s budget is unchanged.
      - run: npm run perf
        env:
          PERF_RUNS: 5
          PERF_ATTEMPTS: 3
          PERF_PAUSE_MS: 15000

  # Visual-regression baselines (UX plan U7.2). The API is mocked, so no backend is needed.
  # A required check: the committed baselines were confirmed to match this runner (80/80 on the
  # first CI run that could read them, FE-UX42). After a deliberate UI change, run the manual
  # `visual-update` workflow, download its artifact, review the images by eye and commit them.
  visual:
    # Pinned (not `latest`) so the screenshots do not change under us; the `visual-update` workflow
    # uses the identical image and Node version to regenerate them (tests/ci-workflows.test.ts).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: frontend/test-results
          retention-days: 7
