name: frontend-docker-build

# Builds the web app image (frontend/Dockerfile) on real Docker and runs it, so the Railway
# deploy path is exercised before it is needed (RAILWAY_READINESS_REPORT.md F-02): the build
# takes NEXT_PUBLIC_* as build arguments, the container answers /login on $PORT as an
# unprivileged user, and the security headers are present.
# Not a required check: it is slow.

on:
  push:
    paths:
      - "frontend/**"
      - ".dockerignore"
      - ".github/workflows/frontend-docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-and-serve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.com/api/v1 \
            --build-arg NEXT_PUBLIC_APP_ORIGIN=https://app.example.com \
            -t clonevoice-web .
      - name: Runs as a non-root user
        run: |
          uid=$(docker run --rm clonevoice-web id -u)
          test "$uid" != "0"
      - name: Serves /login on $PORT with the security headers
        run: |
          docker run -d --name web -e PORT=8123 -p 8123:8123 clonevoice-web
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8123/login && break
            sleep 2
          done
          headers=$(curl -fsSI http://localhost:8123/login)
          echo "$headers"
          echo "$headers" | grep -i '^strict-transport-security:'
          echo "$headers" | grep -i '^x-content-type-options: nosniff'
          echo "$headers" | grep -i '^content-security-policy'
      - name: Logs
        if: always()
        run: docker logs web || true
