services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: clonevoice
      POSTGRES_PASSWORD: clonevoice_dev
      POSTGRES_DB: clonevoice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clonevoice"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HARDENING_PLAN.md finding M3: shared rate-limit storage, so limits hold
  # across restarts and (later) multiple workers/replicas. Not published to
  # the host — only the compose network can reach it.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HARDENING_PLAN.md finding H7: this service (plus backend/Dockerfile) was
  # previously missing entirely — `docker-compose up --build` (the README's
  # only documented start command) could bring up `db` but never the API.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Secrets (JWT_SECRET_KEY, GOOGLE_CLIENT_SECRET, ...) come from your own
    # backend/.env (gitignored, never baked into the image — see
    # backend/.env.example and README.md "Environment Setup").
    env_file:
      - backend/.env
    environment:
      # Overrides whatever DATABASE_URL is in backend/.env: inside the
      # compose network the DB is reachable at the `db` service name, not
      # `localhost` (which .env.example defaults to for bare-metal/local use).
      DATABASE_URL: postgresql://clonevoice:clonevoice_dev@db:5432/clonevoice
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      # Model checkpoints, uploads, and outputs are deliberately not baked
      # into the image (see backend/Dockerfile, .dockerignore) — these
      # volumes are what make them persist across container recreation.
      # WEIGHTS_DIR, UPLOAD_DIR and OUTPUT_DIR are all anchored to BASE_DIR
      # (/app/backend), independent of the container's working directory.
      - backend_weights:/app/backend/weights
      - backend_uploads:/app/backend/uploads
      - backend_outputs:/app/backend/outputs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Exactly one container, one uvicorn worker (set explicitly in
    # backend/Dockerfile's CMD) — the inference semaphore (H6) is process-local
    # state, so do not scale this via `--workers` or `deploy.replicas` without
    # addressing that first (rate limits are shared via redis, see M3).

volumes:
  postgres_data:
  backend_weights:
  backend_uploads:
  backend_outputs:
