name: visual-update

# Regenerates the visual-regression baselines on the SAME runner image and Node version as the
# `visual` job in frontend.yml, because screenshots only match on the machine that made them
# (fonts and anti-aliasing differ per OS). Manual only. It never commits: it uploads the images as
# an artifact so a person reviews them by eye and commits them, so a regression can not be
# accepted automatically. See frontend/README.md "Visual regression".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-baselines:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Start from nothing so a removed route or width cannot leave a stale image behind.
      - run: rm -f visual/__screenshots__/*.png
      - run: npm run test:visual -- --update-snapshots
      # A second pass without the flag proves the images just written are stable on this runner.
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: frontend/visual/__screenshots__
          retention-days: 14
          if-no-files-found: error
