name: worker-docker-build

# Builds the Chatterbox inference worker image on real Docker and runs it
# (SPEECH_QUALITY_PLAN.md S4.3 open item "the Docker image is unbuilt";
# CHATTERBOX_ROLLOUT_PLAN.md R0.1). The model loads when the process starts,
# so the job downloads the Nano weights from Hugging Face, waits for /health,
# and makes one real synthesis on CPU. It also checks what the worker README
# promises: a non-root user, no token baked into the image, no request text or
# token in the logs, and no temporary reference file left behind.
# Not a required check: it is slow and needs the network.

on:
  push:
    paths:
      - "tts_worker/**"
      - ".dockerignore"
      - ".github/workflows/worker-docker-build.yml"
  workflow_dispatch:
  schedule:
    # Weekly (Tuesday, a day after the backend image), so a moved upstream
    # (base image, the two Git-commit dependencies, the model repository)
    # shows up without waiting for the next worker edit.
    - cron: "0 7 * * 2"

permissions:
  contents: read

env:
  SMOKE_TEXT: "Continuous integration smoke test for the worker image."
  # Chatterbox Turbo and Nano assert `len(reference) / sr > 5.0` ("Audio prompt must be longer than
  # 5 seconds"), so a 5-second clip is rejected with a 422. The repository has no speech sample, so
  # the job makes a speech-like signal of this length.
  REFERENCE_SECONDS: "8"

jobs:
  image-and-synthesis:
    # Both images run the same smoke test on CPU: `cuda` is the GPU host's image (PyPI torch with its
    # CUDA runtime), `cpu` is the small one for a CPU-only host (CHATTERBOX_ROLLOUT_PLAN.md R0.6).
    name: image-and-synthesis (${{ matrix.torch_backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch_backend: cuda
            size_limit_mb: 8192
          - torch_backend: cpu
            size_limit_mb: 6000
    env:
      IMAGE: clonevoice-tts-worker:${{ matrix.torch_backend }}
      TORCH_BACKEND: ${{ matrix.torch_backend }}
      SIZE_LIMIT_MB: ${{ matrix.size_limit_mb }}
    steps:
      - uses: actions/checkout@v4

      # The lock pulls PyPI's CUDA torch, so the image is large. Free the
      # runner's pre-installed toolchains first; the build needs the room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the worker image
        run: docker build -f tts_worker/Dockerfile --build-arg TORCH_BACKEND="$TORCH_BACKEND" -t "$IMAGE" .

      # The CUDA image is about 6.4 GB (PyPI's CUDA torch); the limit catches a runaway, and the CPU
      # image must stay well below it. Raise a limit deliberately, not by accident.
      - name: Image size
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          mb=$((size / 1024 / 1024))
          echo "Worker image ($TORCH_BACKEND) size: ${mb} MB (limit ${SIZE_LIMIT_MB} MB)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$mb" -le "$SIZE_LIMIT_MB"

      - name: Image is non-root, holds no secret, and has the pinned libraries
        run: |
          test "$(docker run --rm "$IMAGE" id -u)" = "10001"
          if docker image inspect "$IMAGE" --format '{{json .Config.Env}}' | grep -qi 'TTS_WORKER_TOKEN'; then
            echo "TTS_WORKER_TOKEN must not be baked into the image"; exit 1
          fi
          docker run --rm -i -e TORCH_BACKEND "$IMAGE" python - <<'PY'
          import importlib.metadata as md
          import importlib.util
          import os
          import pkg_resources  # resemble-perth imports it; setuptools 81 removed it
          import perth, chatterbox, torch, transformers
          assert torch.__version__.startswith("2.6.0"), torch.__version__
          assert transformers.__version__ == "5.2.0", transformers.__version__
          if os.environ["TORCH_BACKEND"] == "cpu":
              # No CUDA runtime, no triton: nothing a CPU host would load.
              assert torch.__version__.endswith("+cpu"), torch.__version__
              assert torch.version.cuda is None, torch.version.cuda
              assert importlib.util.find_spec("nvidia") is None, "CUDA runtime packages are installed"
              assert importlib.util.find_spec("triton") is None, "triton is installed"
          else:
              assert torch.version.cuda and torch.version.cuda.startswith("12."), torch.version.cuda
          print("torch", torch.__version__, "| cuda", torch.version.cuda,
                "| transformers", transformers.__version__, "| setuptools", md.version("setuptools"))
          PY

      - name: Start the worker on CPU (downloads the Nano weights)
        run: |
          token=$(openssl rand -hex 24)
          echo "::add-mask::$token"
          echo "TOKEN=$token" >> "$GITHUB_ENV"
          docker run -d --name tts-worker -p 8100:8100 \
            -e TTS_WORKER_TOKEN="$token" -e TTS_WORKER_MODEL=nano \
            -e TTS_WORKER_DEVICE=cpu -e OMP_NUM_THREADS=4 "$IMAGE"

      - name: Wait for the model to load and /health to answer
        run: |
          for i in $(seq 1 180); do
            if curl -sf http://127.0.0.1:8100/health -o health.json; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' tts-worker)" != "true" ]; then
              echo "worker exited before becoming healthy"; docker logs tts-worker; exit 1
            fi
            sleep 5
          done
          test -s health.json || { echo "worker not healthy after 15 minutes"; docker logs tts-worker; exit 1; }
          cat health.json
          python3 - <<'PY'
          import json
          health = json.load(open("health.json"))
          assert health == {"ready": True, "model": "nano", "device": "cpu", "sample_rate": 24000}, health
          PY

      - name: Make a reference clip longer than the model's 5 second minimum
        run: |
          python3 - <<'PY'
          import math, os, struct, wave
          rate, seconds = 16000, int(os.environ["REFERENCE_SECONDS"])
          frames = bytearray()
          phase = 0.0
          for n in range(rate * seconds):
              t = n / rate
              f0 = 120 + 25 * math.sin(2 * math.pi * 0.5 * t)       # a drifting voice pitch
              phase += 2 * math.pi * f0 / rate
              syllable = 0.5 * (1 + math.sin(2 * math.pi * 3.5 * t))  # about 3.5 syllables a second
              sample = sum(math.sin(k * phase) / k for k in range(1, 12)) * syllable * 0.22
              frames += struct.pack("<h", int(max(-1.0, min(1.0, sample)) * 32767))
          with wave.open("ref.wav", "wb") as out:
              out.setnchannels(1); out.setsampwidth(2); out.setframerate(rate)
              out.writeframes(bytes(frames))
          print(f"ref.wav: {seconds} s at {rate} Hz")
          PY

      - name: Authentication and request checks answer before any synthesis
        run: |
          url=http://127.0.0.1:8100/v1/synthesize
          ref="reference=@ref.wav;type=audio/wav"
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$@"; }
          test "$(code -X POST "$url" -F text=hi -F model=nano -F "$ref")" = "401"
          test "$(code -X POST "$url" -H 'Authorization: Bearer wrong' -F text=hi -F model=nano -F "$ref")" = "401"
          test "$(code -X POST "$url" -H "Authorization: Bearer $TOKEN" -F text=hi -F model=turbo -F "$ref")" = "409"
          test "$(code -X POST "$url" -H "Authorization: Bearer $TOKEN" -F text=hi -F model=nano -F "reference=@README.md;type=audio/wav")" = "422"

      - name: One real synthesis on CPU
        run: |
          code=$(curl -s -o out.wav -D headers.txt -w '%{http_code}' --max-time 900 \
            -X POST http://127.0.0.1:8100/v1/synthesize \
            -H "Authorization: Bearer $TOKEN" \
            -F "text=$SMOKE_TEXT" -F model=nano -F truncation_retries=0 \
            -F "reference=@ref.wav;type=audio/wav")
          echo "status $code"; cat headers.txt
          if [ "$code" != "200" ]; then echo "response body:"; cat out.wav; echo; exit 1; fi
          grep -qi '^content-type: audio/wav' headers.txt
          grep -qi '^x-sample-rate: 24000' headers.txt
          python3 - <<'PY'
          import array, struct
          data = open("out.wav", "rb").read()
          assert data[:4] == b"RIFF" and data[8:12] == b"WAVE", "not a WAV file"
          pos, fmt, samples = 12, None, None
          while pos + 8 <= len(data):
              name, size = data[pos:pos + 4], struct.unpack("<I", data[pos + 4:pos + 8])[0]
              body = data[pos + 8:pos + 8 + size]
              if name == b"fmt ":
                  fmt = struct.unpack("<HHIIHH", body[:16])
              elif name == b"data":
                  samples = body
              pos += 8 + size + (size & 1)
          assert fmt and samples, "missing fmt or data chunk"
          tag, channels, rate, _, _, bits = fmt
          assert (tag, channels, rate, bits) == (3, 1, 24000, 32), fmt  # 32-bit float, mono, 24 kHz
          wave = array.array("f")
          wave.frombytes(samples[: len(samples) // 4 * 4])
          seconds = len(wave) / rate
          peak = max(abs(x) for x in wave)
          print(f"{seconds:.2f} s, peak {peak:.3f}")
          assert 0.5 < seconds < 60, seconds
          assert 0.01 < peak <= 1.5, peak  # audible and finite, not silence or noise blow-up
          PY

      # README.md "stateless ... the text and audio are never logged".
      - name: Nothing private in the logs, no temporary file left behind
        run: |
          docker logs tts-worker > worker.log 2>&1
          if grep -qF "$SMOKE_TEXT" worker.log; then echo "request text found in the worker log"; exit 1; fi
          if grep -qF "$TOKEN" worker.log; then echo "token found in the worker log"; exit 1; fi
          leftover=$(docker exec tts-worker sh -c 'ls /tmp/*.wav 2>/dev/null | wc -l')
          test "$leftover" = "0"

      - name: Worker logs (diagnostics)
        if: always()
        run: docker logs tts-worker 2>&1 | tail -80 || true

      - name: Tear down
        if: always()
        run: docker rm -f tts-worker || true
